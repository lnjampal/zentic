services:
  web:
    image: ghcr.io/zentic/zentic/web:0.2.0
    build: ./web
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ghcr.io/zentic/zentic/server:0.2.0
    build: ./server
    ports:
      - "80:80"
    env_file:
      - ./server/.env
    restart: unless-stopped
